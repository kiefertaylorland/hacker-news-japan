name: E2E

# Browser E2E (Playwright) against a local Supabase stack with a fake GitHub
# OAuth server — see scripts/e2e.sh. Not a required check: home-page stories
# come from the live Algolia API, so an outage there shouldn't block merges.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/app/auth/**"
      - "src/lib/auth/**"
      - "src/lib/bookmarks/**"
      - "src/lib/supabase/**"
      - "src/proxy.ts"
      - "src/components/auth/**"
      - "src/components/saved/**"
      - "src/components/stories/StoryCard.tsx"
      - "src/hooks/useOptimisticBookmarks.ts"
      - "supabase/**"
      - "tests/e2e/**"
      - "scripts/e2e.sh"
      - "playwright.config.ts"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npx supabase stop
        if: always()
