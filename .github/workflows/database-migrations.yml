name: Database Migrations

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Read hosted migration history only; do not apply SQL or rebuild Vercel"
        type: boolean
        default: false
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: read

# A canceled deployment may have committed SQL. Let each reconciliation finish.
concurrency:
  group: hosted-supabase-migrations
  cancel-in-progress: false

jobs:
  reconcile:
    # Manual branch diagnostics are read-only; SQL deployment remains main-only.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.check_only)
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # The lockfile selects the CLI; JSON history parsing is tested for 2.117.0.
      - run: npm ci
      - name: Replay committed migrations on a disposable database
        if: '!inputs.check_only'
        run: |
          npx --no-install supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor
          npx --no-install supabase test db
      - name: Stop disposable database
        if: always() && !inputs.check_only
        run: npx --no-install supabase stop --no-backup
      - name: Check, apply, and verify hosted migrations
        id: migrate
        run: bash scripts/deploy-migrations.sh --linked ${{ inputs.check_only && '--check-only' || '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || 'yovbadgitdtbmomeuotz' }}
      - name: Request Vercel rebuild after migration verification
        if: '!inputs.check_only && (steps.migrate.outputs.pending_count != ''0'' || github.event_name != ''schedule'')'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK" > /dev/null
          else
            echo "::warning::VERCEL_DEPLOY_HOOK is not configured. If the schema build check blocked a deployment, redeploy it after this job succeeds."
          fi
